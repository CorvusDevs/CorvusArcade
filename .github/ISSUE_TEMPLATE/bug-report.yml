name: Corvus Arcade bug
description: Report a problem with the Corvus Arcade app or interface.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Corvus Arcade. Do not include passwords, license keys, or personal account data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I installed the latest Corvus Arcade release.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
  - type: input
    id: version
    attributes:
      label: Corvus Arcade version
      placeholder: 0.9.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac and macOS
      description: Include the Mac model, memory, and macOS version.
      placeholder: Mac mini M4, 16 GB, macOS 26.4
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or diagnostics
      description: Attach safe screenshots or relevant diagnostics after removing personal information.
